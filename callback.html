<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yahoo Auth · Nile Draft Helper</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:620px;margin:48px auto;padding:0 20px;color:#111;background:#fff}
  h2{margin:0 0 6px}
  p{color:#555}
  code{display:block;background:#f3f4f6;border:1px solid #e5e7eb;padding:16px;border-radius:10px;word-break:break-all;font-size:16px;margin:14px 0;line-height:1.4}
  button{padding:12px 18px;font-size:16px;border:0;border-radius:10px;background:#2563eb;color:#fff;cursor:pointer}
  .err{color:#b91c1c}
</style>
<h2>🏀 Yahoo authorization code</h2>
<p id="msg">Reading code…</p>
<code id="code"></code>
<button id="btn" onclick="navigator.clipboard.writeText(document.getElementById('code').textContent).then(()=>btn.textContent='Copied ✓')">Copy code</button>
<script>
  const p = new URLSearchParams(location.search);
  const code = p.get('code'), err = p.get('error');
  const msg = document.getElementById('msg'), el = document.getElementById('code'), btn = document.getElementById('btn');
  if (code) { el.textContent = code; msg.textContent = 'Success — paste this code back to the assistant:'; }
  else { msg.className = 'err'; msg.textContent = 'No code found' + (err ? ': ' + err : '. Did you approve the request?'); el.style.display='none'; btn.style.display='none'; }
</script>
</html>

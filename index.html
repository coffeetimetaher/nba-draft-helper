<title>Draft Helper</title>
<style>
:root{
  --bg:#0b0f14; --surface:#141b24; --surface2:#1c2733; --border:#26303c;
  --fg:#e8eef4; --muted:#8b9bac; --accent:#f97316; --accentdim:#7c3a12;
  --good:#22c55e; --warn:#eab308; --err:#ef4444; --line:#2a3542;
}
@media (prefers-color-scheme: light){
  :root{--bg:#f6f8fa;--surface:#fff;--surface2:#f0f3f6;--border:#dfe5ec;
        --fg:#101722;--muted:#5b6876;--accentdim:#fde3cf;--line:#e6ebf1;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
.wrap{max-width:560px;margin:0 auto;padding:12px;}
header{position:sticky;top:0;z-index:10;background:var(--bg);padding-top:8px;}
h1{font-size:15px;margin:0 0 8px;color:var(--muted);font-weight:600;letter-spacing:.3px;text-transform:uppercase;}
.hud{display:flex;gap:8px;margin-bottom:10px;}
.stat{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 12px;}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
.stat .v{font-size:22px;font-weight:700;margin-top:2px;}
.stat .v.small{font-size:14px;font-weight:600;}
.banner{border-radius:12px;padding:9px 12px;margin-bottom:10px;font-size:13px;font-weight:600;display:none;}
.banner.cliff{display:block;background:var(--accentdim);color:var(--accent);border:1px solid var(--accent);}
.needs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);}
.chip.need{background:var(--accent);color:#fff;border-color:var(--accent);}
.search{width:100%;padding:12px 14px;font-size:16px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface);color:var(--fg);margin-bottom:10px;}
.tabs{display:flex;gap:6px;margin-bottom:10px;}
.tab{flex:1;text-align:center;padding:8px;border-radius:10px;background:var(--surface);border:1px solid var(--border);
  color:var(--muted);font-size:13px;font-weight:600;}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:10px 12px;margin-bottom:8px;}
.row .rk{font-size:12px;color:var(--muted);width:30px;text-align:center;flex:none;}
.row .mid{flex:1;min-width:0;}
.row .nm{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .sub{font-size:12px;color:var(--muted);margin-top:2px;}
.row .fill{color:var(--accent);font-weight:600;}
.row .po-up{color:var(--good);} .row .po-dn{color:var(--warn);}
.row .inj{color:var(--err);}
.btns{display:flex;gap:6px;flex:none;}
.b{border:none;border-radius:10px;padding:9px 11px;font-size:13px;font-weight:700;color:#fff;}
.b.mine{background:var(--accent);} .b.gone{background:var(--surface2);color:var(--muted);border:1px solid var(--border);}
.tierhdr{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:12px 2px 6px;}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 12px;}
.cat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:7px;text-align:center;}
.cat .cn{font-size:10px;color:var(--muted);} .cat .cv{font-size:14px;font-weight:700;margin-top:1px;}
.cat.weak{border-color:var(--accent);} .cat.weak .cv{color:var(--accent);}
.foot{display:flex;gap:8px;margin:12px 0 24px;}
.foot .b{flex:1;text-align:center;background:var(--surface);color:var(--fg);border:1px solid var(--border);padding:12px;}
.empty{color:var(--muted);text-align:center;padding:24px;font-size:14px;}
</style>

</head>

  let h=P.filter(p=>p.n.includes(q));if(!h.length)h=P.filter(p=>q.split(" ").every(w=>p.n.includes(w)));
  if(!h.length&&q.length>=2&&q.length<=4&&/^[a-z]+$/.test(q))h=P.filter(p=>p.n.split(" ").map(w=>w[0]).join("")===q);
  return h.length?h.sort((a,b)=>a.board-b.board)[0]:null;}
const avail=()=>P.filter(p=>!st.drafted.includes(p.n));
function needs(){let pr={};CATS.forEach(c=>pr[c]=DATA.keeper_cat[c]);
  st.mine.forEach(n=>CATS.forEach(c=>pr[c]+=BYN[n].cat[c]));
  let nd=Object.entries(pr).sort((a,b)=>a[1]-b[1]).slice(0,3).map(x=>x[0]);return{nd,pr};}
function act(n,mine){let p=BYN[n];if(!p||st.drafted.includes(n))return;
  st.drafted.push(n);st.hist.push({n,mine});if(mine)st.mine.push(n);save();render();}
function undo(){let h=st.hist.pop();if(!h)return;st.drafted=st.drafted.filter(x=>x!==h.n);
  if(h.mine)st.mine=st.mine.filter(x=>x!==h.n);save();render();}
function render(){
  const {nd}=needs(); const av=avail();
  document.getElementById("hAvail").textContent=av.length;
  document.getElementById("hMine").textContent=st.mine.length;
  const three=av.filter(p=>p.cat["3PM"]>0.5).length;
  document.getElementById("h3").textContent=three;
  // needs chips
  document.getElementById("needs").innerHTML=CATS.map(c=>`<span class="chip ${nd.includes(c)?'need':''}">${c}</span>`).join("");
  // cliff
  const srt=av.sort((a,b)=>a.board-b.board);
  const cb=document.getElementById("cliff");
  if(srt.length){const t=srt[0].tier,same=srt.filter(p=>p.tier===t).length;
    if(same<=3){cb.classList.add("cliff");cb.textContent=`⛰️ Tier cliff — only ${same} left in the top tier. Grab if it fits.`;}
    else cb.classList.remove("cliff");}
  // list
  const q=norm(document.getElementById("q").value);
  const L=document.getElementById("list"); L.innerHTML="";
  if(view==="mine"){
    const {pr}=needs();
    const cg=document.createElement("div");cg.className="catgrid";
    cg.innerHTML=CATS.map(c=>`<div class="cat ${nd.includes(c)?'weak':''}"><div class="cn">${c}</div><div class="cv">${pr[c]>=0?'+':''}${pr[c].toFixed(1)}</div></div>`).join("");
    L.appendChild(cg);
    L.insertAdjacentHTML("beforeend",`<div class="tierhdr">Keepers</div>`);
    (DATA.keepers||[]).forEach(p=>L.appendChild(rowEl(p,true)));
    L.insertAdjacentHTML("beforeend",`<div class="tierhdr">Drafted</div>`);
    if(!st.mine.length)L.insertAdjacentHTML("beforeend",`<div class="empty">No draft picks yet. Tap “Mine” on a player when you draft them.</div>`);
    st.mine.map(n=>BYN[n]).forEach(p=>L.appendChild(rowEl(p,true)));
    return;
  }
  let rows=srt;
  if(q)rows=rows.filter(p=>p.n.includes(q)||p.n.split(" ").some(w=>w.startsWith(q)));
  if(!rows.length){L.innerHTML=`<div class="empty">No match.</div>`;return;}
  let lastTier=null;
  rows.slice(0,60).forEach(p=>{
    if(!q&&p.tier!==lastTier){lastTier=p.tier;
      const h=document.createElement("div");h.className="tierhdr";h.textContent="Tier "+p.tier;L.appendChild(h);}
    L.appendChild(rowEl(p,false));
  });
}
function rowEl(p,inMine){
  const {nd}=needs();
  const fills=nd.filter(c=>p.cat[c]>0.4);
  const po=p.po>=12?'<span class="po-up">⭐PO'+p.po+'</span>':(p.po<=10?'<span class="po-dn">↓PO'+p.po+'</span>':'PO'+p.po);
  const inj=(p.inj==="H"||p.inj==="E")?' <span class="inj">🏥</span>':'';
  const el=document.createElement("div");el.className="row";
  el.innerHTML=`<div class="rk">${p.board!=null?p.board:'<span style="color:var(--accent);font-weight:700">K</span>'}</div>
    <div class="mid"><div class="nm">${p.name}</div>
    <div class="sub">#${p.bbm} · ${p.team} ${p.pos} · ${po}${inj} ${fills.length?'· <span class="fill">'+fills.join(" ")+'</span>':''}</div></div>
    <div class="btns">${inMine?'':'<button class="b mine" data-m="'+p.n+'">Mine</button><button class="b gone" data-g="'+p.n+'">Gone</button>'}</div>`;
  return el;
}
document.getElementById("list").addEventListener("click",e=>{
  const m=e.target.getAttribute("data-m"),g=e.target.getAttribute("data-g");
  if(m){act(m,true);} if(g){act(g,false);}
});
document.getElementById("q").addEventListener("input",render);
document.getElementById("undo").onclick=undo;
document.getElementById("reset").onclick=()=>{if(confirm("Reset the whole draft?")){st={drafted:[],mine:[],hist:[]};save();render();}};
function setView(v){view=v;document.getElementById("tBoard").classList.toggle("on",v==="board");
  document.getElementById("tMine").classList.toggle("on",v==="mine");render();}
document.getElementById("tBoard").onclick=()=>setView("board");
document.getElementById("tMine").onclick=()=>setView("mine");
render();
</script>
<script>if("serviceWorker"in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
</body>

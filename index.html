<title>Draft Helper</title>
<style>
:root{
  --bg:#0b0f14; --surface:#141b24; --surface2:#1c2733; --border:#26303c;
  --fg:#e8eef4; --muted:#8b9bac; --accent:#f97316; --accentdim:#7c3a12;
  --good:#22c55e; --warn:#eab308; --err:#ef4444; --line:#2a3542;
}
@media (prefers-color-scheme: light){
  :root{--bg:#f6f8fa;--surface:#fff;--surface2:#f0f3f6;--border:#dfe5ec;
        --fg:#101722;--muted:#5b6876;--accentdim:#fde3cf;--line:#e6ebf1;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
.wrap{max-width:560px;margin:0 auto;padding:12px;}
header{position:sticky;top:0;z-index:10;background:var(--bg);padding-top:8px;}
h1{font-size:15px;margin:0 0 8px;color:var(--muted);font-weight:600;letter-spacing:.3px;text-transform:uppercase;}
.hud{display:flex;gap:8px;margin-bottom:10px;}
.stat{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 12px;}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
.stat .v{font-size:22px;font-weight:700;margin-top:2px;}
.stat .v.small{font-size:14px;font-weight:600;}
.banner{border-radius:12px;padding:9px 12px;margin-bottom:10px;font-size:13px;font-weight:600;display:none;}
.banner.cliff{display:block;background:var(--accentdim);color:var(--accent);border:1px solid var(--accent);}
.needs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);}
.chip.need{background:var(--accent);color:#fff;border-color:var(--accent);}
.chip.punt{opacity:.4;text-decoration:line-through;}
.search{width:100%;padding:12px 14px;font-size:16px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface);color:var(--fg);margin-bottom:10px;}
.tabs{display:flex;gap:6px;margin-bottom:10px;}
.tab{flex:1;text-align:center;padding:8px;border-radius:10px;background:var(--surface);border:1px solid var(--border);
  color:var(--muted);font-size:13px;font-weight:600;}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:10px 12px;margin-bottom:8px;}
.row .rk{font-size:12px;color:var(--muted);width:30px;text-align:center;flex:none;}
.row .mid{flex:1;min-width:0;}
.row .nm{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .sub{font-size:12px;color:var(--muted);margin-top:2px;}
.row .fill{color:var(--accent);font-weight:600;}
.row .po-up{color:var(--good);} .row .po-dn{color:var(--warn);}
.row .inj{color:var(--err);}
.btns{display:flex;gap:6px;flex:none;}
.b{border:none;border-radius:10px;padding:9px 11px;font-size:13px;font-weight:700;color:#fff;}
.b.mine{background:var(--accent);} .b.gone{background:var(--surface2);color:var(--muted);border:1px solid var(--border);}
.tierhdr{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:12px 2px 6px;}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 12px;}
.cat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:7px;text-align:center;}
.cat .cn{font-size:10px;color:var(--muted);} .cat .cv{font-size:14px;font-weight:700;margin-top:1px;}
.cat.weak{border-color:var(--accent);} .cat.weak .cv{color:var(--accent);}
.foot{display:flex;gap:8px;margin:12px 0 24px;}
.foot .b{flex:1;text-align:center;background:var(--surface);color:var(--fg);border:1px solid var(--border);padding:12px;}
.empty{color:var(--muted);text-align:center;padding:24px;font-size:14px;}
.seg{display:flex;gap:6px;margin-bottom:8px;}
.seg button{flex:1;padding:7px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12px;font-weight:600;}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.pickmark{background:var(--accentdim);color:var(--accent);font-weight:700;font-size:12px;border-radius:9px;padding:6px 10px;margin:8px 0 6px;text-align:center;}
.row .neg{color:var(--err);font-weight:600;} .row .fade{color:var(--warn);font-weight:600;}
</style>

    if(mn.has(nm))o.roster.push({name:a.displayName,status:s2});else if(/out/i.test(s2)&&BYN[nm]&&BYN[nm].board<=120)o.alerts.push({name:a.displayName,status:s2,board:BYN[nm].board});}));}catch(e){}
  try{const j=await fetch(ESPNB+"/scoreboard").then(r=>r.json());(j.events||[]).slice(0,12).forEach(e=>o.scores.push({name:e.name,st:((e.status||{}).type||{}).shortDetail||""}));}catch(e){}
  try{const j=await fetch(ESPNB+"/news").then(r=>r.json());(j.articles||[]).slice(0,6).forEach(a=>o.heads.push(a.headline||""));}catch(e){}
  try{const x=await fetch(ROTO).then(r=>r.text());const doc=new DOMParser().parseFromString(x,"text/xml");[...doc.querySelectorAll("item")].slice(0,40).forEach(it=>{const ti=(it.querySelector("title")||{}).textContent||"";const nmR=ti.split(":")[0].trim();const pn=norm(nmR);const note=ti.split(":").slice(1).join(":").trim();
    if(mn.has(pn))o.roster.push({name:nmR,note:note,src:"RW"});else if(BYN[pn]&&BYN[pn].board<=120)o.notes.push({name:nmR,board:BYN[pn].board,note:note});});}catch(e){}
  localStorage.setItem("news_v1",JSON.stringify(o));if(view==="news")renderNews(o);}
const BBM2ESPN={SAS:"SA",PHO:"PHX",GSW:"GS",NYK:"NY",NOP:"NO",NOR:"NO",WAS:"WSH",UTA:"UTAH"};
function weekStart(){const d=new Date();const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);d.setHours(0,0,0,0);return d;}
function ymd(d){return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");}
function pgval(p,nd){return Object.values(p.cat).reduce((a,b)=>a+b,0)+0.6*nd.reduce((a,c)=>a+(p.cat[c]||0),0);}
function tg(team,g){return g[BBM2ESPN[team]||team]||0;}
async function fetchStream(){const ws=weekStart();const we=new Date(ws);we.setDate(we.getDate()+6);const g={};
  for(let i=0;i<7;i++){const d=new Date(ws);d.setDate(d.getDate()+i);
    try{const j=await fetch(ESPNB+"/scoreboard?dates="+ymd(d)).then(r=>r.json());(j.events||[]).forEach(e=>e.competitions[0].competitors.forEach(c=>{const a=c.team.abbreviation;g[a]=(g[a]||0)+1;}));}catch(e){}}
  const {nd}=needs();const mn=myNames();
  const roster=[...(DATA.keepers||[]),...st.mine.map(n=>BYN[n])].filter(Boolean).map(p=>({name:p.name,g:tg(p.team,g)})).sort((a,b)=>b.g-a.g);
  const cand=DATA.players.filter(p=>!mn.has(p.n)&&tg(p.team,g)>0).map(p=>({p,gm:tg(p.team,g)})).map(x=>({...x,s:pgval(x.p,nd)*x.gm})).sort((a,b)=>b.s-a.s).slice(0,15);
  const o={ts:Date.now(),ws:ws.toISOString().slice(0,10),we:we.toISOString().slice(0,10),total:Object.values(g).reduce((a,b)=>a+b,0),roster,
    cand:cand.map(x=>({name:x.p.name,board:x.p.board,team:x.p.team,pos:x.p.pos,g:x.gm,up:(x.p.up||[]),fills:nd.filter(c=>x.p.cat[c]>0.4),fade:x.p.fade?x.p.fade.tier:null}))};
  localStorage.setItem("stream_v1",JSON.stringify(o));if(view==="stream")renderStream(o);}
function renderStream(d){const L=document.getElementById("list");L.innerHTML="";
  if(!d){L.innerHTML=`<div class="empty">Loading schedule… (needs connection once, then cached offline)</div>`;return;}
  const ago=Math.max(0,Math.round((Date.now()-d.ts)/60000));
  L.insertAdjacentHTML("beforeend",`<div class="tierhdr">Week ${d.ws} to ${d.we} · ${d.total} games · ${ago}m ago${navigator.onLine?'':' · offline'}</div>`);
  L.insertAdjacentHTML("beforeend",`<div class="pickmark">💳 Reg season: 70 total (~3/wk). Playoffs: 5/wk, no cap — stream freely.</div>`);
  L.insertAdjacentHTML("beforeend",`<div class="tierhdr">Your roster · games this week</div>`);
  d.roster.forEach(r=>L.insertAdjacentHTML("beforeend",newsRow(r.name,(r.g<=2?'🔴 '+r.g+' games':(r.g>=4?'🟢 '+r.g+' games':r.g+' games')))));
  L.insertAdjacentHTML("beforeend",`<div class="tierhdr">Top streamers · value × games</div>`);
  d.cand.forEach(c=>{const up=c.up.map(x=>x+'+').join(' ');const fade=c.fade?' · '+c.fade:'';const fl=c.fills.length?' · fills '+c.fills.join(','):'';
    L.insertAdjacentHTML("beforeend",newsRow('#'+c.board+' '+c.name,'🗓 '+c.g+'g · '+c.team+' '+c.pos+(up?' · '+up:'')+fl+fade));});}
function setView(v){view=v;["Board","Mine","News","Stream"].forEach(x=>document.getElementById("t"+x).classList.toggle("on",v===x.toLowerCase()));
  render();if(v==="news"&&navigator.onLine)fetchNews();if(v==="stream"&&navigator.onLine)fetchStream();}
document.getElementById("tBoard").onclick=()=>setView("board");
document.getElementById("tMine").onclick=()=>setView("mine");
document.getElementById("tNews").onclick=()=>setView("news");
document.getElementById("tStream").onclick=()=>setView("stream");
async function syncLive(){
  try{
    const r=await fetch("draft_live.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)return;
    const d=await r.json();let ch=false;
    (d.drafted||[]).forEach(n=>{if(BYN[n]&&!st.drafted.includes(n)){st.drafted.push(n);st.hist.push({n,mine:(d.mine||[]).includes(n),live:true});ch=true;}});
    (d.mine||[]).forEach(n=>{if(BYN[n]&&!st.mine.includes(n)){st.mine.push(n);ch=true;}});
    if(st.liveCount!==(d.count||0)){st.liveCount=d.count||0;ch=true;}
    let ind=document.getElementById("liveInd");
    if(!ind){ind=document.createElement("div");ind.id="liveInd";ind.style.cssText="position:fixed;top:4px;right:8px;font-size:11px;color:var(--err);font-weight:700;z-index:99";document.body.appendChild(ind);}
    ind.textContent="🔴 LIVE "+(d.count||0)+" picks";
    if(ch){save();render();}
  }catch(e){}
}
if(["localhost","127.0.0.1"].includes(location.hostname)){setInterval(syncLive,5000);syncLive();}
render();
</script>
